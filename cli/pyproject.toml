[project]
name = "test-insights-cli"
version = "0.1.0"
description = "Test Insights CLI"
requires-python = ">=3.13"
dependencies = [
  "click==8.1.8",
  "httpx==0.28.1",
  "rich==13.9.4",
]

[project.scripts]
ti = "ti.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ti"]
